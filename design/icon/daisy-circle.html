<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}svg{width:512px;height:512px;display:block}</style></head><body>
<svg id="daisy-circle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- wobbly watercolour edge -->
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation=".35"/>
  </filter>
  <!-- pigment granulation inside the wash -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="5" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 .78  0 0 0 0 .42  0 0 0 0 .52  0 0 0 .22 -.04"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="petal" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="2" seed="8" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation=".18"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .05 0"/>
  </filter>
  <radialGradient id="pool" cx="46%" cy="42%" r="60%">
    <stop offset="0" stop-color="#f8d7df"/><stop offset=".7" stop-color="#f5c9d3"/><stop offset="1" stop-color="#eeb3c3"/>
  </radialGradient>
</defs>
<rect width="100" height="100" fill="#fbf8ef"/>
<rect width="100" height="100" filter="url(#paper)"/>
<!-- the pink circle: a pool of colour, deeper where the edge dried -->
<g filter="url(#wash)">
  <circle cx="50" cy="50" r="40" fill="url(#pool)"/>
  <circle cx="50" cy="50" r="39.2" fill="none" stroke="#e9a7b9" stroke-width="1.6" opacity=".55"/>
  <circle cx="50" cy="50" r="40" fill="#f5c9d3" filter="url(#grain)"/>
</g>
<!-- a soft shadow so the white petals lift off the pink -->
<g filter="url(#soft)" opacity=".45" transform="translate(1 1.4)">
  <ellipse cx="63.09" cy="51.71" rx="10.80" ry="4.4" transform="rotate(7.4 63.09 51.71)" fill="#c9798f"/><ellipse cx="60.48" cy="58.03" rx="11.40" ry="4.4" transform="rotate(37.4 60.48 58.03)" fill="#c9798f"/><ellipse cx="55.06" cy="62.19" rx="12.00" ry="4.4" transform="rotate(67.4 55.06 62.19)" fill="#c9798f"/><ellipse cx="48.29" cy="63.09" rx="10.80" ry="4.4" transform="rotate(97.4 48.29 63.09)" fill="#c9798f"/><ellipse cx="41.97" cy="60.48" rx="11.40" ry="4.4" transform="rotate(127.4 41.97 60.48)" fill="#c9798f"/><ellipse cx="37.81" cy="55.06" rx="12.00" ry="4.4" transform="rotate(157.4 37.81 55.06)" fill="#c9798f"/><ellipse cx="36.91" cy="48.29" rx="10.80" ry="4.4" transform="rotate(187.4 36.91 48.29)" fill="#c9798f"/><ellipse cx="39.52" cy="41.97" rx="11.40" ry="4.4" transform="rotate(217.4 39.52 41.97)" fill="#c9798f"/><ellipse cx="44.94" cy="37.81" rx="12.00" ry="4.4" transform="rotate(247.4 44.94 37.81)" fill="#c9798f"/><ellipse cx="51.71" cy="36.91" rx="10.80" ry="4.4" transform="rotate(277.4 51.71 36.91)" fill="#c9798f"/><ellipse cx="58.03" cy="39.52" rx="11.40" ry="4.4" transform="rotate(307.4 58.03 39.52)" fill="#c9798f"/><ellipse cx="62.19" cy="44.94" rx="12.00" ry="4.4" transform="rotate(337.4 62.19 44.94)" fill="#c9798f"/>
</g>
<g filter="url(#petal)"><ellipse cx="63.09" cy="51.71" rx="10.80" ry="4.4" transform="rotate(7.4 63.09 51.71)" fill="#fffdf8"/><ellipse cx="58.63" cy="51.13" rx="5.94" ry="2.2" transform="rotate(7.4 58.63 51.13)" fill="#efe1e4" opacity=".75"/><ellipse cx="60.48" cy="58.03" rx="11.40" ry="4.4" transform="rotate(37.4 60.48 58.03)" fill="#fffdf8"/><ellipse cx="56.91" cy="55.29" rx="6.27" ry="2.2" transform="rotate(37.4 56.91 55.29)" fill="#efe1e4" opacity=".75"/><ellipse cx="55.06" cy="62.19" rx="12.00" ry="4.4" transform="rotate(67.4 55.06 62.19)" fill="#fffdf8"/><ellipse cx="53.34" cy="58.03" rx="6.60" ry="2.2" transform="rotate(67.4 53.34 58.03)" fill="#efe1e4" opacity=".75"/><ellipse cx="48.29" cy="63.09" rx="10.80" ry="4.4" transform="rotate(97.4 48.29 63.09)" fill="#fffdf8"/><ellipse cx="48.87" cy="58.63" rx="5.94" ry="2.2" transform="rotate(97.4 48.87 58.63)" fill="#efe1e4" opacity=".75"/><ellipse cx="41.97" cy="60.48" rx="11.40" ry="4.4" transform="rotate(127.4 41.97 60.48)" fill="#fffdf8"/><ellipse cx="44.71" cy="56.91" rx="6.27" ry="2.2" transform="rotate(127.4 44.71 56.91)" fill="#efe1e4" opacity=".75"/><ellipse cx="37.81" cy="55.06" rx="12.00" ry="4.4" transform="rotate(157.4 37.81 55.06)" fill="#fffdf8"/><ellipse cx="41.97" cy="53.34" rx="6.60" ry="2.2" transform="rotate(157.4 41.97 53.34)" fill="#efe1e4" opacity=".75"/><ellipse cx="36.91" cy="48.29" rx="10.80" ry="4.4" transform="rotate(187.4 36.91 48.29)" fill="#fffdf8"/><ellipse cx="41.37" cy="48.87" rx="5.94" ry="2.2" transform="rotate(187.4 41.37 48.87)" fill="#efe1e4" opacity=".75"/><ellipse cx="39.52" cy="41.97" rx="11.40" ry="4.4" transform="rotate(217.4 39.52 41.97)" fill="#fffdf8"/><ellipse cx="43.09" cy="44.71" rx="6.27" ry="2.2" transform="rotate(217.4 43.09 44.71)" fill="#efe1e4" opacity=".75"/><ellipse cx="44.94" cy="37.81" rx="12.00" ry="4.4" transform="rotate(247.4 44.94 37.81)" fill="#fffdf8"/><ellipse cx="46.66" cy="41.97" rx="6.60" ry="2.2" transform="rotate(247.4 46.66 41.97)" fill="#ef <!-- centre -->
<g filter="url(#petal)">
  <circle cx="50" cy="50" r="6.6" fill="#f3c93f"/>
  <circle cx="51.6" cy="51.8" r="3.6" fill="#e2a62b" opacity=".55"/>
  <circle cx="48.2" cy="48.1" r="2" fill="#f9e27c" opacity=".8"/>
</g>
</svg></body></html>
